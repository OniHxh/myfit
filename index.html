<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MyFit">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>MyFit</title>
<style>
:root{--bg:#07080c;--s1:#12141c;--s2:#1c1f2b;--s3:#2a2e3d;--tx:#f5f7ff;--mu:#8a90a6;--ac:#5b7cfa;--aci:#7c8cff;--on-ac:#fff;--p:#38bdf8;--c:#fbbf24;--f:#f472b6;--ok:#34d399;--bad:#f87171;--r:22px;--g1:#3b82f6;--g2:#8b5cf6;--grad:linear-gradient(135deg,var(--g1),var(--g2));--line:rgba(255,255,255,.06);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{overscroll-behavior-y:none}
body.noscroll{overflow:hidden}
main{padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 100px);max-width:560px;margin:0 auto}
h1{font-size:30px;margin:0 0 16px;letter-spacing:-.02em;line-height:1.1}
h2{font-size:13px;margin:24px 4px 8px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
h3{font-size:17px;margin:0}
p{margin:0 0 10px}
.muted{color:var(--mu)}.small{font-size:13px}.cap::first-letter{text-transform:uppercase}
.acc{color:var(--aci)}.ok{color:var(--ok)}.bad{color:var(--bad)}
.card{background:var(--s1);border-radius:var(--r);padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;background:var(--s2);font-weight:600;color:var(--tx);text-decoration:none;user-select:none;-webkit-user-select:none}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--ac);color:var(--on-ac)}
.btn.sm{min-height:34px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.icon-btn{width:40px;height:40px;border-radius:12px;background:var(--s2);display:inline-flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;flex:none}
.in{width:100%;background:var(--s2);border:1px solid transparent;border-radius:12px;padding:11px 12px;color:var(--tx);font:inherit;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
.in:focus{border-color:var(--aci)}
select.in{background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
textarea.in{min-height:70px;resize:vertical}
label.f{display:block;margin-bottom:12px}label.f>span{display:block;font-size:13px;color:var(--mu);margin:0 0 5px 2px}
.seg{display:flex;background:var(--s2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:36px;border-radius:9px;font-weight:600;font-size:14px;color:var(--mu)}
.seg button.on{background:var(--s1);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.bar{height:8px;background:var(--s2);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:var(--ac);transition:width .4s}
.bar i.p{background:var(--p)}.bar i.c{background:var(--c)}.bar i.f{background:var(--f)}.bar i.over{background:var(--bad)}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--s2);color:var(--mu)}
.badge.boxe{color:var(--f)}.badge.muscu{color:var(--p)}
.empty{color:var(--mu);text-align:center;padding:18px 8px;font-size:14px}
/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;padding:6px 6px calc(env(safe-area-inset-bottom) + 6px);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--s2)}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--mu);padding:6px 0;max-width:110px}
#nav button.on{color:var(--aci)}
#nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* home */
.cal{display:flex;gap:18px;align-items:center}
.ringwrap{position:relative;width:128px;height:128px;flex:none}
.ringwrap svg{width:100%;height:100%}
.rbg{fill:none;stroke:var(--s2);stroke-width:11}.rfg{fill:none;stroke:var(--ac);stroke-width:11;stroke-linecap:round;transition:stroke-dashoffset .6s}.rfg.over{stroke:var(--bad)}
.ringc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ringc b{font-size:28px;letter-spacing:-.02em;line-height:1}.ringc span{font-size:12px;color:var(--mu);margin-top:3px}
.kv{display:flex;justify-content:space-between;gap:8px;padding:4px 0;font-size:14px}.kv span{color:var(--mu)}
.mb{margin-top:10px}.mb-h{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}.mb-h span:first-child{color:var(--mu)}
.big{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1}
.big small{font-size:16px;color:var(--mu);font-weight:600;margin-left:3px}
.tile{background:var(--s1);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0}
.tile .lbl{font-size:12px;color:var(--mu);font-weight:600}
.tile .val{font-size:20px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.tile .val small{font-size:12px;color:var(--mu);font-weight:600}
.water-btns{display:flex;gap:6px}.water-btns button{flex:1;height:32px;border-radius:9px;background:var(--s2);font-weight:700;font-size:18px}
.banner{display:block;width:100%;text-align:left;background:var(--ac);color:var(--on-ac);font-weight:700;padding:14px 16px;border-radius:var(--r);margin-bottom:12px}
/* lists */
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--s2);width:100%;text-align:left}
.li:first-child{border-top:0}
.li .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:13px;color:var(--mu)}
.li .r{margin-left:auto;text-align:right;font-weight:600;white-space:nowrap}
.datenav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.datenav b{font-size:17px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.week button{background:var(--s2);border-radius:12px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.week button.today{outline:2px solid var(--aci)}
.week .d{font-size:11px;color:var(--mu);font-weight:600}
.week .n{font-size:11px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.week .n.rest{color:var(--mu);font-weight:500}
/* session */
.sethd,.setrow{display:grid;grid-template-columns:28px 1fr 1fr 44px;gap:8px;align-items:center}
.sethd{font-size:12px;color:var(--mu);font-weight:600;margin:10px 0 4px}
.setrow{margin-bottom:6px}
.setrow .in{padding:9px 10px;text-align:center}
.setrow.done .in{background:color-mix(in srgb,var(--ok) 16%,var(--s2))}
.chk{width:44px;height:42px;border-radius:12px;background:var(--s2);display:flex;align-items:center;justify-content:center}
.chk svg{width:20px;height:20px;stroke:var(--mu);stroke-width:3;fill:none}
.setrow.done .chk{background:var(--ok)}.setrow.done .chk svg{stroke:#fff}
.num{font-weight:700;color:var(--mu);text-align:center}
.prev{font-size:12px;color:var(--mu)}
.stepper{display:flex;align-items:center;gap:10px}.stepper b{font-size:24px;min-width:48px;text-align:center}
#restbar{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 76px);z-index:25;max-width:536px;margin:0 auto;background:var(--tx);color:var(--bg);border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.35);overflow:hidden}
#restbar[hidden]{display:none}
#restbar b{font-size:24px;font-variant-numeric:tabular-nums;flex:1}
#restbar button{background:color-mix(in srgb,var(--bg) 12%,transparent);color:var(--bg);font-weight:700;padding:8px 12px;border-radius:10px}
#restprog{position:absolute;left:0;bottom:0;height:3px;background:var(--ac)}
/* charts */
.chart svg{width:100%;height:auto;display:block}
.chart .grid line{stroke:var(--s2)}.chart text{fill:var(--mu);font-size:10px}
.chart .ln{fill:none;stroke:var(--ac);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .ln.plan{stroke:var(--mu);stroke-width:1.5;stroke-dasharray:4 4;opacity:.8}
.chart .dot{fill:var(--mu);opacity:.55}.chart .dot.acc{fill:var(--ac);opacity:1}
.chart .tg{stroke:var(--ok);stroke-dasharray:5 4;stroke-width:1.5}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mu);margin-top:6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* photos */
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.photos button{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--s2)}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.photos span{position:absolute;left:0;right:0;bottom:0;font-size:11px;font-weight:600;color:#fff;padding:14px 6px 5px;background:linear-gradient(transparent,rgba(0,0,0,.7))}
.photos button.sel{outline:3px solid var(--ac);outline-offset:-3px}
.ba{position:relative;aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:var(--s2);touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:ew-resize}
.ba img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
.ba-b{position:absolute;inset:0;clip-path:inset(0 calc(100% - var(--x)) 0 0)}
.ba-h{position:absolute;top:0;bottom:0;left:var(--x);width:3px;margin-left:-1.5px;background:#fff;box-shadow:0 0 6px rgba(0,0,0,.4)}
.ba-h::after{content:'‹ ›';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:36px;height:36px;border-radius:50%;background:#fff;color:#000;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
.ba-t{position:absolute;top:10px;font-size:12px;font-weight:700;color:#fff;background:rgba(0,0,0,.55);padding:3px 8px;border-radius:99px}.ba-t.l{left:10px}.ba-t.r{right:10px}
.strip{display:flex;gap:6px;overflow-x:auto;margin-top:14px;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.strip button{flex:none;width:64px;position:relative;border-radius:10px;overflow:hidden;aspect-ratio:3/4;background:var(--s2)}
.strip img{width:100%;height:100%;object-fit:cover;display:block}
.strip span{position:absolute;left:0;right:0;bottom:0;font-size:10px;font-weight:600;color:#fff;padding:8px 3px 3px;background:linear-gradient(transparent,rgba(0,0,0,.7));text-align:center}
.strip button.sel{outline:3px solid var(--ac);outline-offset:-3px}
.notice{border:1px solid color-mix(in srgb,var(--ac) 45%,transparent)}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bdg{background:var(--s2);border-radius:14px;padding:10px 4px;text-align:center;font-size:11px;font-weight:600;line-height:1.2}
.bdg b{display:block;font-size:26px;margin-bottom:4px}
.bdg.off{opacity:.35;filter:grayscale(1)}
.streaks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.bxclock{font-size:64px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1.1}
.bxt.round .bxclock{color:var(--ac)}.bxt.rest .bxclock{color:var(--c)}
.daychips{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.daychips button{background:var(--s2);border-radius:10px;min-height:40px;font-weight:600;font-size:13px}
.daychips button.on{background:var(--ac);color:var(--on-ac)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cmp img{width:100%;border-radius:12px;display:block;aspect-ratio:3/4;object-fit:cover}
/* sheet */
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,0);display:flex;align-items:flex-end;justify-content:center;transition:background .25s}
.ov.in{background:rgba(0,0,0,.5)}
.panel{width:100%;max-width:560px;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--s1);border-radius:22px 22px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom) + 18px);transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.9,.25,1)}
.ov.in .panel{transform:none}
.grab{width:38px;height:5px;border-radius:9px;background:var(--s3);margin:0 auto 12px}
.panel .in{background:var(--s2)}
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}
.sheet-h h3{font-size:19px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.chips button{background:var(--s2);border-radius:99px;padding:7px 12px;font-size:14px;font-weight:600}
.chips button.on{background:var(--ac);color:var(--on-ac)}
.preview{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;background:var(--s2);border-radius:14px;padding:12px 4px;margin-bottom:14px}
.preview b{display:block;font-size:18px}.preview span{font-size:11px;color:var(--mu);font-weight:600}
.foodlist{max-height:46vh;overflow-y:auto;margin:0 -4px;padding:0 4px}
.ex-ed{background:var(--s2);border-radius:14px;padding:10px;margin-bottom:8px}
.ex-ed .in{background:var(--s1);padding:9px 10px}
.ex-ed .g3{display:grid;grid-template-columns:1fr 1fr 1fr 40px;gap:6px;margin-top:6px;align-items:end}
.ex-ed .g3 span{font-size:11px;color:var(--mu);display:block;margin:0 0 3px 2px}
.ex-ed .icon-btn{background:var(--s1);width:40px;height:40px;font-size:16px}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translate(-50%,-150%);z-index:80;background:var(--tx);color:var(--bg);font-weight:600;padding:10px 16px;border-radius:99px;font-size:14px;transition:transform .3s;max-width:90vw;text-align:center}
#toast.show{transform:translate(-50%,0)}
.hello{margin-bottom:4px}
.code{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--s2);border-radius:8px;padding:2px 6px;word-break:break-all}
ol.steps{padding-left:20px;margin:0 0 12px}ol.steps li{margin-bottom:8px}
.ob{max-width:460px;margin:0 auto}
.logo{width:56px;height:56px;border-radius:16px;background:var(--ac);display:flex;align-items:center;justify-content:center;margin:12px 0 18px}
.logo svg{width:30px;height:30px;stroke:var(--on-ac);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
/* ===== Thème sport premium ===== */
body{background:radial-gradient(1200px 600px at 80% -10%,rgba(139,92,246,.16),transparent 60%),radial-gradient(900px 500px at -10% 10%,rgba(59,130,246,.14),transparent 60%),var(--bg);background-attachment:fixed;min-height:100vh}
h1{font-size:34px;font-weight:800;letter-spacing:-.035em}
h2{font-size:12px;letter-spacing:.12em;font-weight:700;color:#6f7590}
h3{font-weight:700;letter-spacing:-.01em}
.card,.tile{background:linear-gradient(160deg,#171a25 0%,#10121a 100%);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.04)}
.card{border-radius:var(--r);padding:18px}
.tile{border-radius:20px}
.btn{border-radius:14px;background:var(--s2);border:1px solid var(--line)}
.btn.pri,.banner,.chips button.on,.daychips button.on{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 8px 22px rgba(91,124,250,.35)}
.btn.ghost{border-color:transparent;box-shadow:none}
.icon-btn{background:var(--s2);border:1px solid var(--line)}
.in{background:#0d0f16;border:1px solid var(--line)}
.panel .in{background:#0d0f16}
.in:focus{border-color:#7c8cff;box-shadow:0 0 0 3px rgba(124,140,255,.18)}
.seg{background:#0d0f16;border:1px solid var(--line)}
.seg button.on{background:var(--grad);color:#fff;box-shadow:0 4px 14px rgba(91,124,250,.35)}
.bar{background:#0d0f16;height:9px}
.bar i{background:var(--grad)}
.bar i.p{background:linear-gradient(90deg,#0ea5e9,#38bdf8)}.bar i.c{background:linear-gradient(90deg,#f59e0b,#fbbf24)}.bar i.f{background:linear-gradient(90deg,#ec4899,#f472b6)}.bar i.over{background:linear-gradient(90deg,#ef4444,#f87171)}
.big{font-size:44px;font-weight:800;letter-spacing:-.045em}
.ringc b{font-size:32px;font-weight:800;letter-spacing:-.04em}
.ringwrap{width:138px;height:138px;filter:drop-shadow(0 0 18px rgba(91,124,250,.35))}
.rbg{stroke:#0d0f16;stroke-width:12}.rfg{stroke:url(#rg);stroke-width:12}.rfg.over{stroke:var(--bad)}
.tile .val{font-size:22px;font-weight:800}
.li{border-top-color:var(--line)}
#nav{background:rgba(10,11,17,.72);border-top:1px solid var(--line);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4)}
#nav button.on{color:#fff}
#nav button.on svg{stroke:url(#ng);filter:drop-shadow(0 0 8px rgba(124,140,255,.6))}
.panel{background:linear-gradient(180deg,#151824,#0e1017);border-top:1px solid var(--line)}
.badge{background:#0d0f16;border:1px solid var(--line)}
.notice{border:1px solid rgba(124,140,255,.35);background:linear-gradient(160deg,rgba(59,130,246,.14),rgba(139,92,246,.10) 60%,#10121a)}
.week button,.daychips button,.chips button,.bdg,.water-btns button{background:#0d0f16;border:1px solid var(--line)}
.week button.today{outline:none;border-color:#7c8cff;box-shadow:0 0 0 1px #7c8cff inset}
.setrow .in{background:#0d0f16}
.setrow.done .in{background:rgba(52,211,153,.12);border-color:rgba(52,211,153,.3)}
.chk{background:#0d0f16;border:1px solid var(--line)}.setrow.done .chk{background:var(--ok);border-color:transparent}
#restbar{background:var(--grad);color:#fff}#restbar button{background:rgba(255,255,255,.18);color:#fff}#restprog{background:#fff}
.chart .ln{stroke:url(#lg)}.chart .dot.acc{fill:#8b9dff}.chart .grid line{stroke:var(--line)}
.preview{background:#0d0f16;border:1px solid var(--line)}
/* graphiques calories + sport */
.kb svg{width:100%;height:auto;display:block}
.kb text{fill:var(--mu);font-size:10px;font-weight:600}
.kb .tl{stroke:#7c8cff;stroke-dasharray:4 4;stroke-width:1.3;opacity:.8}
.kb .gl{stroke:var(--line)}
.kb .b{fill:url(#bg)}.kb .b.over{fill:url(#bo)}.kb .b.cheat{fill:url(#bc)}.kb .b.empty{fill:#1a1d29}
.kb .b.today{stroke:#fff;stroke-width:1.2;stroke-opacity:.7}
.kb .sm{fill:var(--p)}.kb .sb{fill:var(--f)}
.kstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;text-align:center}
.kstats div{background:#0d0f16;border:1px solid var(--line);border-radius:14px;padding:10px 4px}
.kstats b{display:block;font-size:18px;font-weight:800;letter-spacing:-.02em}.kstats span{font-size:11px;color:var(--mu);font-weight:600}
.legend i.sm{background:var(--p);border-radius:50%}.legend i.sb{background:var(--f);border-radius:50%}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.calg .h{font-size:11px;color:var(--mu);font-weight:700;padding-bottom:2px}

function calc(){

}

function findPRs(exs){

/* ----- Graphique ----- */
function chart({series,target,xfmt,yfmt=f1,h=180}){
 const W=340,H=h,pl=34,pr=10,pt=10,pb=22;
 const ys=[],xs=[];series.forEach(s=>s.pts.forEach(p=>{xs.push(p[0]);ys.push(p[1])}));
 if(!xs.length)return '<div class="empty">Pas encore assez de données.</div>';
 if(target!=null)ys.push(target);
 let y0=Math.min(...ys),y1=Math.max(...ys);if(y1-y0<1){y0-=0.5;y1+=0.5}const pd=(y1-y0)*0.1;y0-=pd;y1+=pd;
 let x0=Math.min(...xs),x1=Math.max(...xs);if(x1===x0){x0-=1;x1+=1}
 const X=x=>pl+(x-x0)/(x1-x0)*(W-pl-pr),Y=y=>pt+(1-(y-y0)/(y1-y0))*(H-pt-pb);
 let g='<g class="grid">';for(let i=0;i<=3;i++){const v=y0+(y1-y0)*i/3,y=Y(v);g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text x="${pl-5}" y="${y+3}" text-anchor="end">${yfmt(v)}</text>`}g+='</g>';
 g+=`<text x="${pl}" y="${H-5}">${xfmt(x0)}</text><text x="${W-pr}" y="${H-5}" text-anchor="end">${xfmt(x1)}</text>`;
 if(target!=null)g+=`<line class="tg" x1="${pl}" x2="${W-pr}" y1="${Y(target)}" y2="${Y(target)}"/>`;
 series.forEach(s=>{if(s.line&&s.pts.length>1)g+=`<path class="ln ${s.cls||''}" d="${s.pts.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join('')}"/>`;if(s.dots)g+=s.pts.map(p=>`<circle class="dot ${s.acc?'acc':''}" cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="${s.r||3}"/>`).join('')});
 return `<div class="chart"><svg viewBox="0 0 ${W} ${H}">${g}</svg></div>`;
}

function sessOn(k){const ss=S.sessions.filter(s=>s.date===k);return{m:ss.some(s=>s.type!=='boxe'),b:ss.some(s=>s.type==='boxe'),n:ss.length}}
const DL=['D','L','M','M','J','V','S'];
function kcalBars(keys,{h=170,tap=false,letters=false}={}){
 const t=targets().kcal,n=keys.length,W=340,H=h,pl=30,pr=6,pt=14,pb=38;
 const vals=keys.map(k=>dayT(k).k);
 const max=Math.max(t*1.2,...vals)*1.06;
 const cw=(W-pl-pr)/n,bw=Math.max(3,Math.min(30,cw*0.62));
 const Y=v=>pt+(1-v/max)*(H-pt-pb),base=H-pb;
 let g='';
 for(let v=1000;v<max;v+=1000)g+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${pl-5}" y="${Y(v)+3}" text-anchor="end">${v/1000}k</text>`;
 keys.forEach((k,i)=>{
  const v=vals[i],x=pl+i*cw+(cw-bw)/2,d=S.days[k],sp=sessOn(k);
  const cls=v<=0?'empty':d&&d.cheat?'cheat':v>t?'over':'';
  const y=v>0?Y(v):base-3,hh=Math.max(3,base-y),rx=Math.min(6,bw/2);
  let bar=k>today()?'':`<rect class="b ${cls} ${k===today()?'today':''}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${hh.toFixed(1)}" rx="${rx}"/>`;
  if(n<=7&&v>0)bar+=`<text x="${(x+bw/2).toFixed(1)}" y="${(y-4).toFixed(1)}" text-anchor="middle" style="fill:${v>t&&!(d&&d.cheat)?'var(--bad)':'var(--tx)'}">${(v/1000).toFixed(1).replace('.',',')}k</text>`;
  const cx=x+bw/2,lblEvery=n<=7?1:n<=14?2:5;
  if(letters)bar+=`<text x="${cx.toFixed(1)}" y="${base+14}" text-anchor="middle" style="${k===today()?'fill:var(--tx)':''}">${DL[parseKey(k).getDay()]}</text>`;
  else if(i%lblEvery===0||i===n-1)bar+=`<text x="${cx.toFixed(1)}" y="${base+14}" text-anchor="middle">${parseKey(k).getDate()}</text>`;
  const r=n>14?2.6:3.8,my=base+28;
  if(sp.m&&sp.b)bar+=`<circle class="sm" cx="${(cx-r-1).toFixed(1)}" cy="${my}" r="${r}"/><circle class="sb" cx="${(cx+r+1).toFixed(1)}" cy="${my}" r="${r}"/>`;
  else if(sp.m)bar+=`<circle class="sm" cx="${cx.toFixed(1)}" cy="${my}" r="${r}"/>`;
  else if(sp.b)bar+=`<circle class="sb" cx="${cx.toFixed(1)}" cy="${my}" r="${r}"/>`;
  g+=tap?`<g data-a="goDay" data-k="${k}" style="cursor:pointer"><rect x="${(pl+i*cw).toFixed(1)}" y="0" width="${cw.toFixed(1)}" height="${H}" fill="transparent"/>${bar}</g>`:bar;
 });

function parseHealth(txt){
 if(!txt)return null;const out={};
 const re=/(pas|steps|sommeil|sleep|date)\s*[=:]\s*([^;\n&]+)/gi;let m;
 while((m=re.exec(txt))){const k=m[1].toLowerCase(),v=m[2].trim();
  if(k==='pas'||k==='steps'){const n=num(v);if(!isNaN(n))out.steps=Math.round(n)}
  else if(k==='sommeil'||k==='sleep'){let h;if(v.includes(':')){const[a,b]=v.split(':').map(Number);h=a+(b||0)/60}else{const n=num(v);if(isNaN(n))continue;h=n>1440?n/3600:n>24?n/60:n}out.sleep=r1(h*4)/4}
  else if(/^\d{4}-\d{2}-\d{2}$/.test(v))out.date=v;}
 return (out.steps!=null||out.sleep!=null)?out:null;
}
function applyHealth(txt){
 const h=parseHealth(txt);if(!h){toast('Aucune donnée Santé trouvée');return false}
 const k=h.date||today(),d=day(k,true);
 if(h.steps!=null)d.steps=h.steps;if(h.sleep!=null&&h.sleep>0)d.sleep=h.sleep;save();
 toast(`Importé : ${h.steps!=null?f0(h.steps)+' pas':''}${h.steps!=null&&h.sleep?' · ':''}${h.sleep?fmtH(h.sleep):''}`);return true;
}

let rest=null,restIv=null,actx=null;
function unlockAudio(){try{if(!actx){const C=window.AudioContext||window.webkitAudioContext;if(C)actx=new C()}if(actx&&actx.state==='suspended')actx.resume()}catch(e){}}
function tickBox(){
 const a=S.active;if(!a||a.type!=='boxe')return;const b=a.boxe,t=b.timer||{phase:'idle',round:1,running:false};
 if(t.running){let ms=t.endAt-Date.now();
  if(t.phase==='round'&&!t.warned&&ms<=10000&&ms>0){t.warned=true;beep(1,1200)}
  if(ms<=0){
   if(t.phase==='round'){b.done=Math.max(b.done||0,t.round);
    if(t.round>=b.rounds){t.phase='done';t.running=false;beep(4,880);if(navigator.vibrate)navigator.vibrate([400,150,400]);toast('Dernier round terminé, bravo !')}
    else if(b.restSec>0){t.phase='rest';t.endAt=Date.now()+b.restSec*1000;beep(3,880);if(navigator.vibrate)navigator.vibrate([200,100,200])}
    else{t.round++;t.endAt=Date.now()+b.roundMin*60000;t.warned=false;beep(1,660)}}
   else if(t.phase==='rest'){t.phase='round';t.round++;t.endAt=Date.now()+b.roundMin*60000;t.warned=false;beep(1,660);if(navigator.vibrate)navigator.vibrate(300)}
   save();
  }}
 const card=$('#bxcard');if(!card)return;
 const ms=t.running?t.endAt-Date.now():t.phase==='idle'?b.roundMin*60000:(t.left||0);
 card.className='card bxt '+(t.phase==='round'?'round':t.phase==='rest'?'rest':'');
 $('#bxclock').textContent=mmss(Math.max(0,Math.ceil(ms/1000)));
 $('#bxph').textContent={idle:'Prêt',round:'Round',rest:'Repos',done:'Terminé'}[t.phase]+(t.phase!=='idle'&&t.phase!=='done'&&!t.running?' · en pause':'');
 $('#bxround').textContent=t.phase==='idle'?`${b.rounds} rounds`:`Round ${Math.min(t.round,b.rounds)} / ${b.rounds}`;
 $('#bxbtn').textContent=t.running?'Pause':t.phase==='idle'||t.phase==='done'?'Démarrer':'Reprendre';
}
setInterval(tickBox,250);
function beep(n=3,freq=880){try{if(!actx)return;[...Array(n)].map((_,i)=>i*0.25).forEach(t=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=freq;g.gain.setValueAtTime(0.0001,actx.currentTime+t);g.gain.exponentialRampToValueAtTime(0.3,actx.currentTime+t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+t+0.18);o.connect(g).connect(actx.destination);o.start(actx.currentTime+t);o.stop(actx.currentTime+t+0.2)})}catch(e){}}
function startRest(sec){if(!sec)return;rest={end:Date.now()+sec*1000,total:sec};clearInterval(restIv);restIv=setInterval(tickRest,250);tickRest()}

function tickRest(){const el=$('#restbar');if(!rest){el.hidden=true;return}const ms=rest.end-Date.now();if(ms<=0){beep();if(navigator.vibrate)navigator.vibrate([200,100,200]);stopRest();toast('Repos terminé, série suivante !');return}el.hidden=false;$('#restt').textContent=mmss(Math.ceil(ms/1000));$('#restprog').style.width=(100-ms/(rest.total*1000)*100)+'%'}

 cmpMode(){ui.cmpMode=!ui.cmpMode;ui.sel=[];render()},
 checkin(){ui.ck=true;openSheet(sheetCheckin());setTimeout(()=>{const i=$('#ck-w');i&&!i.value&&i.focus()},350)},
 async ckSave(){
  const st=checkinState(),k=today();
  if(readMeas(k))save();
  if(!st.w){const v=num($('#ck-w')?.value);if(!(v>=30&&v<=300))return toast('Indique ton poids');S.weights[k]=r1(v);save()}
  const w=S.weights[k];
  if(w!=null)for(const p of photos.filter(p=>p.date===k&&p.weight!==w)){p.weight=w;try{await IDB.put(p)}catch(e){}}
  const s2=checkinState();
  if(s2.due){setSheet(sheetCheckin());return toast('Il manque ta photo')}
  ui.ck=false;closeSheet();render();toast('Pesée validée ✓');
 },
 ckLater(){try{localStorage.setItem(SNOOZE,String(Date.now()+3*3600e3))}catch(e){}ui.ck=false;closeSheet();toast('Je te la redemande dans 3 h')},
 ckDay(el){const d=+el.dataset.d,a=ck().days;const i=a.indexOf(d);if(i>=0)a.splice(i,1);else a.push(d);a.sort();save();render()},
 ckPreset(el){ck().days=el.dataset.v.split(',').map(Number);save();render()},
 ckIcs(){icsReminder()},
 baPick(el){const id=el.dataset.id;if(id===ui.baA)return;ui.baB=id;render()},
 adjApply(el){const d=+el.dataset.d;S.profile.adjust=(S.profile.adjust||0)+d;S.adjustLog.push({date:today(),delta:d});save();render();toast(`Nouvel objectif : ${f0(targets().kcal)} kcal`)},
 adjReset(){if(!confirm('Revenir à l\'objectif calculé sans ajustement ?'))return;S.profile.adjust=0;S.adjustLog.push({date:today(),delta:0});save();render()},
 adjSkip(){S.adjustSnooze=addDays(today(),7);save();render()},
 openReport(el){const w=el.dataset.w;S.seenReport=w;save();render();openSheet(sheetHead(`Semaine du ${fmtShort(w)}`)+weekHTML(weekReport(w)))},
 backupLater(){S.backupSnooze=addDays(today(),3);save();render()},
 goDay(el){const k=el.dataset.k;if(k>today())return;ui.date=k;ui.tab='meals';render();window.scrollTo(0,0)},
 kRange(el){ui.kr=+el.dataset.v;render()},
 calNav(el){const[y,m]=ui.calM.split('-').map(Number),d=new Date(y,m-1+Number(el.dataset.d),1),n=d.getFullYear()+'-'+pad(d.getMonth()+1);if(n>today().slice(0,7))return;ui.calM=n;render()},
 weekNav(el){const n=addDays(ui.week,+el.dataset.d);if(n>weekStart(today()))return;ui.week=n;render()},
 msSel(el){ui.ms=el.dataset.v;render()},
 measure(){openSheet(sheetHead('Mensurations')+`<p class="small muted" style="margin-top:-6px">Mesure le matin, ruban à plat, toujours au même endroit (taille : au nombril).</p>${measFields(today())}<button class="btn pri block" data-a="measureSave">Enregistrer</button>`)},
 measureSave(){if(!readMeas(today()))return toast('Indique au moins une mesure');save();closeSheet();render();toast('Mensurations enregistrées')},
 cheat(){const d=day(ui.date,true);d.cheat=!d.cheat;save();render();if(d.cheat)toast('Repas plaisir noté, profite !')},
 copyDay(){const src=prevDayWithFood(ui.date);if(!src)return;const d=day(ui.date,true);MEALS.forEach(([m])=>{d.meals[m].push(...cloneItems(S.days[src].meals[m]||[]))});save();render();toast('Journée copiée')},
 copyMeal(el){const m=el.dataset.m,l=MEALS.find(x=>x[0]===m)[1],list=[];
  for(let i=1;i<=14;i++){const k=addDays(ui.date,-i),it=S.days[k]?.meals[m]||[];if(it.length)list.push([k,it])}
  openSheet(sheetHead(`Copier un ${l.toLowerCase()}`)+(list.length?list.map(([k,it])=>{const t=sumItems(it);return `<button class="li" data-a="copyMealFrom" data-m="${m}" data-k="${k}"><div class="grow"><div class="t">${fmtDay(k)}</div><div class="s">${it.map(x=>esc(x.name)).join(', ')}</div></div><div class="r">${f0(t.k)}</div></button>`}).join(''):'<div class="empty">Rien à copier sur les 14 derniers jours.</div>'))},
 copyMealFrom(el){const m=el.dataset.m;day(ui.date,true).meals[m].push(...cloneItems(S.days[el.dataset.k].meals[m]));save();closeSheet();render();toast('Repas copié')},
 photo(el){const id=el.dataset.id;
  if(ui.cmpMode){const i=ui.sel.indexOf(id);if(i>=0)ui.sel.splice(i,1);else ui.sel.push(id);
   if(ui.sel.length===2){const [a,b]=ui.sel.map(x=>photos.find(p=>p.id===x)).sort((x,y)=>x.date<y.date?-1:1);ui.cmpMode=false;ui.sel=[];render();
    const dw=a.weight&&b.weight?b.weight-a.weight:null;
    openSheet(sheetHead('Comparaison')+`<div class="cmp"><div><img src="${a.data}" alt=""><div class="small" style="margin-top:6px"><b>${fmtShort(a.date)}</b>${a.weight?` · ${f1(a.weight)} kg`:''}</div></div><div><img src="${b.data}" alt=""><div class="small" style="margin-top:6px"><b>${fmtShort(b.date)}</b>${b.weight?` · ${f1(b.weight)} kg`:''}</div></div></div>${dw!=null?`<p class="small muted" style="margin-top:10px">${dn(b.date)-dn(a.date)} jours d'écart · ${dw<=0?'−':'+'}${f1(Math.abs(dw))} kg</p>`:''}`);return}
   render();return}
  const p=photos.find(x=>x.id===id);openSheet(sheetHead(fmtLong(p.date))+`<img src="${p.data}" alt="" style="width:100%;border-radius:14px;display:block">${p.weight?`<p class="small muted" style="margin-top:8px">${f1(p.weight)} kg ce jour-là</p>`:''}<button class="btn ghost danger block" style="margin-top:8px" data-a="delPhoto" data-id="${p.id}">Supprimer la photo</button>`)},
 async delPhoto(el){if(!confirm('Supprimer cette photo ?'))return;try{await IDB.del(el.dataset.id)}catch(e){}await loadPhotos();closeSheet();render()},
 export(){exportData()},
 importPick(){$('#importIn').click()},
 reset(){if(!confirm('Effacer toutes les données ? Exporte une sauvegarde avant si besoin.'))return;if(!confirm('Vraiment tout effacer ? C\'est définitif.'))return;S=blank();save();IDB.clear().catch(()=>{});photos=[];stopRest();ui.tab='home';render()}
};

const IN={
 foodq(el){ui.add.q=el.value;$('#foodlist').innerHTML=foodListHTML();$('#foodlist').scrollTop=0},
 qty(el){ui.qty.amount=num(el.value)||0;$('#qtyprev').innerHTML=qtyPrev();document.querySelectorAll('#sheet .chips button').forEach(b=>b.classList.toggle('on',Number(b.dataset.v)===ui.qty.amount))},
 set(el){const s=S.active.exercises[+el.dataset.e].sets[+el.dataset.s];s[el.dataset.f]=el.value;save()},
 bxNotes(el){S.active.boxe.notes=el.value;save()},
 ed(el){ui.ed[el.dataset.f]=el.value},
 edEx(el){ui.ed.exercises[+el.dataset.i][el.dataset.f]=el.value},
 exo(el){ui.exo=el.value;render()},
 manualToggle(el){if(el.checked){const c=calc();S.profile.manual={kcal:c.kcal,p:c.p,c:c.c,f:c.f}}else delete S.profile.manual;save();render()},
 manual(el){const v=num(el.value);if(v>=0){S.profile.manual[el.dataset.f]=Math.round(v);save()}},
 setting(el){const v=num(el.value);if(v>0){S.settings[el.dataset.f]=v;save()}},
 ckPhoto(el){ck().photo=el.checked;save();render()},
 baSel(el){ui[el.dataset.f]=el.value;render()},
 ckw(el){ui.ckW=el.value}
};
function sheetCheckin(){
 const st=checkinState(),k=today();
 if(!st.date)return sheetHead('Pesée')+'<div class="empty">Aucune pesée prévue.</div>';
 const day_=DOWNAME[parseKey(st.date).getDay()];
 const todayPh=photos.filter(p=>p.date>=st.date);
 return sheetHead(`Pesée du ${day_}`)+`
 <p class="small ${st.late?'bad':'muted'}" style="margin-top:-6px">${st.late?`En retard depuis le ${fmtShort(st.date)} : fais-la maintenant pour garder une courbe fiable.`:'Le matin, à jeun, après les toilettes, toujours dans les mêmes conditions.'}</p>
 <section class="card" style="background:var(--s2)">
  ${st.w?`<div class="row between"><span>Poids</span><b class="ok">✓ ${f1(S.weights[weightKeys().filter(x=>x>=st.date).pop()])} kg</b></div>`:
  `<label class="f" style="margin:0"><span>Poids (kg)</span><input class="in" id="ck-w" data-in="ckw" inputmode="decimal" style="background:var(--s1);font-size:22px;font-weight:700" value="${esc(ui.ckW||'')}" placeholder="${String(currentWeight()).replace('.',',')}"></label>`}
 </section>
 ${ck().photo?`<section class="card" style="background:var(--s2)">
  <div class="row between"><span>Photo</span>${st.ph?'<b class="ok">✓ Prise</b>':'<span class="small muted">De face, même endroit, même lumière</span>'}</div>
  ${todayPh.length?`<div class="strip" style="margin-top:10px">${todayPh.map(p=>`<span style="flex:none;width:64px;aspect-ratio:3/4;border-radius:10px;overflow:hidden"><img src="${p.data}" alt="" style="width:100%;height:100%;object-fit:cover"></span>`).join('')}</div>`:''}
  <label class="btn ${st.ph?'':'pri'} block" for="photoIn" style="margin-top:10px">${st.ph?'Ajouter une autre photo':'Prendre la photo'}</label>
 </section>`:''}
 <details class="card" style="background:var(--s2)" ${S.measures[k]?'open':''}><summary style="font-weight:600;cursor:pointer">Mensurations <span class="small muted">(optionnel)</span></summary><div style="margin-top:12px">${measFields(k)}</div></details>
 <button class="btn pri block" data-a="ckSave">Valider ma pesée</button>
 <button class="btn ghost block" style="margin-top:6px" data-a="ckLater">Plus tard</button>`;
}
function icsReminder(){
 const days=ck().days;if(!days.length)return toast('Choisis au moins un jour');
 const map=['SU','MO','TU','WE','TH','FR','SA'],first=nextDue(addDays(today(),-1));
 const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//MyFit//FR','BEGIN:VEVENT','UID:'+uid()+'@myfit','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z','DTSTART:'+first.replace(/-/g,'')+'T073000','DURATION:PT10M','RRULE:FREQ=WEEKLY;BYDAY='+days.map(d=>map[d]).join(','),'SUMMARY:Pesée MyFit','DESCRIPTION:À jeun\\, après les toilettes. Ouvre MyFit pour noter ton poids'+(ck().photo?' et prendre ta photo':'')+'.','BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Pesée MyFit','TRIGGER:PT0M','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
 shareOrDownload(new Blob([ics],{type:'text/calendar'}),'pesee-myfit.ics','Rappel pesée');
}

/* ---------- Export / import / photos ---------- */
async function exportData(){
 const data={app:'myfit',version:1,exported:new Date().toISOString(),state:S,photos};
 const ok=await shareOrDownload(new Blob([JSON.stringify(data)],{type:'application/json'}),`myfit-sauvegarde-${today()}.json`,'Sauvegarde MyFit');
 if(ok!==false){S.lastExport=today();save();render()}
}
async function shareOrDownload(blob,name,title){
 try{const file=new File([blob],name,{type:blob.type});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title});return true}}catch(e){if(e&&e.name==='AbortError')return false}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
}
async function importData(file){
 try{const data=JSON.parse(await file.text());if(!data||(data.app!=='myfit'&&data.app!=='seche')||!data.state||!data.state.v)throw 0;
  if(!confirm(`Remplacer les données actuelles par la sauvegarde du ${new Date(data.exported).toLocaleDateString('fr-FR')} ?`))return;
  S=Object.assign(blank(),data.state);S.settings=Object.assign(blank().settings,data.state.settings||{});save();
  try{await IDB.clear();for(const p of data.photos||[])await IDB.put(p)}catch(e){}
  await loadPhotos();ui.tab='home';render();toast('Sauvegarde importée');
 }catch(e){toast('Fichier de sauvegarde invalide')}
}
function resizeImage(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{const M=1200,sc=Math.min(1,M/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',0.8))};img.onerror=()=>{URL.revokeObjectURL(url);rej()};img.src=url})}
async function addPhoto(file){try{const data=await resizeImage(file);const p={id:uid(),date:today(),data,weight:S.weights[today()]??currentWeight()};await IDB.put(p);await loadPhotos();render();if(ui.ck&&$('#sheet'))setSheet(sheetCheckin());toast('Photo ajoutée')}catch(e){toast('Impossible d\'ajouter la photo')}}

/* ---------- Évènements ---------- */
document.addEventListener('click',e=>{unlockAudio();const el=e.target.closest('[data-a]');if(!el)return;const fn=A[el.dataset.a];if(!fn)return;if(el.dataset.a==='ovClose'&&e.target!==el)return;fn(el,e)});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset&&el.dataset.in&&IN[el.dataset.in]&&el.type!=='checkbox'&&el.tagName!=='SELECT')IN[el.dataset.in](el)});
document.addEventListener('change',e=>{const el=e.target;
 if(el.id==='photoIn'&&el.files[0]){addPhoto(el.files[0]);el.value='';return}
 if(el.id==='importIn'&&el.files[0]){importData(el.files[0]);el.value='';return}
 if(el.dataset&&el.dataset.in&&IN[el.dataset.in]&&(el.type==='checkbox'||el.tagName==='SELECT'))IN[el.dataset.in](el);
 if(el.dataset&&(el.dataset.in==='setting'||el.dataset.in==='manual'))render();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();if(e.key==='Enter'&&e.target.id==='qtyin'){e.preventDefault();A.qtySave()}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(ui.date>today())ui.date=today();if(!$('#sheet')){render();maybeImposeCheckin()}}});

/* ---------- Démarrage ---------- */
$('#exos').innerHTML=EXOS.map(n=>`<option value="${esc(n)}">`).join('');
(async()=>{
 try{await IDB.open();await loadPhotos()}catch(e){}
 const q=decodeURIComponent(location.search+location.hash);
 if(S.profile&&/(pas|steps|sommeil|sleep)\s*=/.test(q)){applyHealth(q);history.replaceState(null,'',location.pathname)}
 render();
 maybeImposeCheckin();
})();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
